name: Book WOD Classes

on:
  schedule:
    # El bot se levanta 1 hora antes (19:00 hora Madrid) y espera exactamente a las 20:00
    # Domingo (0), Lunes (1), Miércoles (3)
    - cron: "0 18 * 1,2,11,12 0,1,3"    # Invierno (Nov-Feb): 18:00 UTC = 19:00 CET  (UTC+1)
    - cron: "0 17 * 3-10 0,1,3"         # Verano (Mar-Oct): 17:00 UTC = 19:00 CEST (UTC+2)
  workflow_dispatch:              # Opción para ejecutarlo a mano desde GitHub Actions
    inputs:
      dry_run:
        description: 'Dry Run (simular, no reservar)'
        required: false
        type: boolean
        default: false
      skip_wait:
        description: 'Skip Wait (no esperar a la hora target)'
        required: false
        type: boolean
        default: false
      days_ahead:
        description: 'Days Ahead (1=mañana, 4=Lunes si hoy es Jueves)'
        required: true
        type: string
        default: '1'

jobs:
  book:
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run booking script
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Hora a la que se abren las reservas en hora local de Madrid
          TARGET_HOUR_GMT1: 20
          TARGET_MINUTE: 0
        run: |
          echo "🚀 Ejecutando bot de reservas..."
          
          # Construir el comando base
          CMD="python main.py --schedule schedule_10077.json"
          
          # Si se dispara manualmente, usamos los inputs de la interfaz
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="$CMD --days-ahead ${{ github.event.inputs.days_ahead }}"
            
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              CMD="$CMD --dry-run"
            fi
            
            if [ "${{ github.event.inputs.skip_wait }}" = "true" ]; then
              CMD="$CMD --skip-wait"
            fi
          else
            # Si se dispara automáticamente por cron, siempre reserva para mañana
            CMD="$CMD --days-ahead 1"
          fi
          
          echo "Ejecutando: $CMD"
          eval $CMD
