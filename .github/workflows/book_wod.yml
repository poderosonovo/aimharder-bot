name: Book WOD Classes

on:
  schedule:
    # El bot se levanta 10 minutos antes (19:50 hora Madrid) y espera exactamente a las 20:00
    # Domingo (0), Lunes (1), Miércoles (3)
    - cron: "50 18 * 1,2,11,12 0,1,3"   # Invierno (Nov-Feb): 18:50 UTC = 19:50 CET  (UTC+1)
    - cron: "50 17 * 3-10 0,1,3"        # Verano (Mar-Oct): 17:50 UTC = 19:50 CEST (UTC+2)
  workflow_dispatch:              # Opción para ejecutarlo a mano desde GitHub Actions

jobs:
  book:
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run booking script
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Hora a la que se abren las reservas en hora local de Madrid
          TARGET_HOUR_GMT1: 20
          TARGET_MINUTE: 0
        run: |
          echo "🚀 Ejecutando bot de reservas..."
          # --days-ahead 1 porque reservamos para el día siguiente
          python main.py --days-ahead 1 --schedule schedule_10077.json
